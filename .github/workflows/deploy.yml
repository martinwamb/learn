name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Deploying learn.wambugumartin.com ==="
            cd /home/admin/apps/learn

            git pull origin main

            echo "--- Installing dependencies ---"
            npm install

            echo "--- Generating Prisma client ---"
            npx prisma generate

            echo "--- Running database migrations ---"
            # --accept-data-loss: prisma db push otherwise hard-refuses (exits 1, no
            # prompt possible in an unattended pipeline) any new unique constraint,
            # even a provably safe one -- e.g. adding a nullable FK + compound unique
            # to an existing table, where every current row gets NULL for the new
            # column and Postgres treats NULLs as non-conflicting. Schema changes are
            # authored and reviewed in the same commit as this pipeline change, so the
            # confirmation step doesn't add real safety here, only an unattended stall.
            npx prisma db push --accept-data-loss

            echo "--- Seeding curriculum (idempotent upserts) ---"
            npm run seed

            echo "--- Building Next.js app ---"
            npm run build

            echo "--- Restarting PM2 processes ---"
            # -p 3006 is required here (not just in nginx/.env) because `next start` binds
            # its HTTP server before .env is parsed -- PORT cannot be set via .env alone.
            pm2 restart learn || pm2 start npm --name learn -- start -- -p 3006
            # 23:15 / 04:30 UTC (not 02:00 / 03:00) to avoid colliding with port's and
            # publisher-site's own nightly cron jobs at those exact minutes -- both were found
            # racing for CPU with the learn workers at identical times.
            pm2 restart learn-tts-worker || pm2 start "npm run worker:tts" --name learn-tts-worker --cron "15 23 * * *" --no-autorestart
            pm2 restart learn-lesson-worker || pm2 start "npm run worker:lessons" --name learn-lesson-worker --cron "30 4 * * *" --no-autorestart
            # 01:15 UTC -- clear of every slot above plus port's 02:00 KB sync and
            # publisher-site's 02:30/03:00 jobs.
            pm2 restart learn-story-worker || pm2 start "npm run worker:stories" --name learn-story-worker --cron "15 1 * * *" --no-autorestart
            pm2 save

            echo "=== Deploy complete ==="
